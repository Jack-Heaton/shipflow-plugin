name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Script tests
        run: node --test plugins/shipflow/scripts/__tests__/*.test.mjs
      - name: Hook tests
        run: python3 -m pytest -q plugins/shipflow/hooks
      - name: Codex distribution is in sync
        run: python3 scripts/generate-codex.py --check
